configuration:
  tty:
    name: "TTY"
    description: "Name des seriellen Ports / TTY, um mit dem Gerät zu kommunizieren."
  refresh:
    name: "Refresh rate"
    description: "Aktualisierungrate / Wartezeit zwischen zwei Aufrufen des vclients."
  command_timeout:
    name: "Zeitlimit für Befehle"
    description: "Maximale Dauer eines vcontrold-Lesezyklus oder Schreibbefehls in Sekunden (Standard: 120). MQTT-Veröffentlichungen haben ein separates Zeitlimit von 10 Sekunden."
  write_attempts:
    name: "Schreibversuche"
    description: "Anzahl der Versuche für einen MQTT-Setter (1–10, Standard: 3). Jeder Versuch schreibt den Wert, liest den passenden Getter in derselben Sitzung zurück und veröffentlicht ihn; ein Fehler des Daemons oder ein abweichender Rücklesewert löst den nächsten Versuch aus. Das Ergebnis wird unter `<mqtt_topic>/ack/<setter>` veröffentlicht."
  device_id:
    name: "Device ID"
    description: "Viessmann Gerätekennung (2098 => V200KW2 , 2053 => GWG_VBEM, 20CB => VScotHO1 , 2094 => V200KW1)"
  vcontrol_host:
    name: "Vcontrold Host"
    description: "vcontrold host für die Verbindung (default: localhost)"
  vcontrol_port:
    name: "Vcontrold Port"
    description: "vcontrold für die Verbindung (default: 3002)"
  mqtt_host:
    name: "MQTT Hostname"
    description: "Hostname eines remote MQTT brokers. Falls leer wird der interne MQTT Broker verwendet"
  mqtt_port:
    name: "MQTT Port"
    description: "Port eines remote MQTT brokers. Falls leer wird der interne MQTT Broker verwendet"
  mqtt_user:
    name: "MQTT User"
    description: "User eines remote MQTT brokers. Falls leer wird der default username des internen MQTT Broker verwendet"
  mqtt_password:
    name: "MQTT Password"
    description: "Password eines remote MQTT brokers. Falls leer wird der interne MQTT Broker verwendet"
  mqtt_topic:
    name: "MQTT Topic"
    description: "Topic unter dem die Viessmann Daten verwalten werden. Default `openv`"
  debug:
    name: "Debug"
    description: "Ausgabe von Debug-Nachrichten"
  commands:
    name: "Commands"
    description: "Liste der zu sendenden Befehle. Konfiguriere pro Listeneintrag einen Wert, z. B. `getTempA:FLOAT` oder `getError0:STRING`. `TYPE` muss `FLOAT` oder `STRING` sein."
